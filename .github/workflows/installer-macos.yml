name: Installer macOS

on:
  workflow_dispatch:
  push:
    branches:
      - 'build/macos-installer'
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: xcode-27
            arch: arm64
            os-major: '27'
          - runner: macos-15-intel
            arch: x64
            os-major: '15'
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Verify macOS version
        env:
          EXPECTED_OS: ${{ matrix.os-major }}
        run: |
          version=$(sw_vers -productVersion)
          echo "macOS $version ($(uname -m))"
          test "${version%%.*}" = "$EXPECTED_OS"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build:installer:mac -- ${{ matrix.arch }}
      - name: Verify installation
        run: |
          sudo installer -pkg dist/installer-mac/NotoMixer*-macos-${{ matrix.arch }}.pkg -target /
          app=/Applications/NotoMixer.app
          codesign --verify --deep --strict "$app"
          "$app/Contents/Resources/ffmpeg/bin/ffmpeg" -version
          ELECTRON_RUN_AS_NODE=1 "$app/Contents/MacOS/NotoMixer" -e \
            'const asar = process.resourcesPath + "/app.asar"; require(asar + "/audio-compat.js").getFfmpegPath(); require.resolve(asar + "/node_modules/ws");'
      - name: Verify mixer startup
        if: matrix.arch == 'arm64'
        run: |
          app=/Applications/NotoMixer.app
          open -n "$app" --args --remote-debugging-port=9222
          trap 'pkill -x NotoMixer || true' EXIT
          for attempt in {1..30}; do
            if curl -fsS --max-time 2 http://127.0.0.1:9222/json/list 2>/dev/null | node -e '
              const assert = require("node:assert/strict");
              const pages = JSON.parse(require("node:fs").readFileSync(0, "utf8"));
              assert(pages.some(page => page.url.endsWith("/app.asar/index.html")));
              assert(!pages.some(page => page.url.includes("/app.asar/splash.html")));
            ' 2>/dev/null; then
              test -f "$HOME/Library/Application Support/NotoMixer/config.notomixer"
              test -f "$HOME/Library/Application Support/NotoMixer/settings/userSettings.notomixer"
              echo "Mixer and user settings initialized."
              exit 0
            fi
            sleep 1
          done
          log show --last 2m --predicate 'process == "NotoMixer"' --style compact
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: NotoMixer-macos-${{ matrix.arch }}
          path: dist/installer-mac/NotoMixer*-macos-${{ matrix.arch }}.pkg
          if-no-files-found: error
